<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hall Ticket — {{ student_name }}</title>
  <style>
    @page { size: A4; margin: 20mm 15mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; font-size: 12px; color: #222; }
    .card { border: 2px solid #333; border-radius: 6px; padding: 18px; }
    .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 14px; }
    .header h1 { font-size: 17px; font-weight: bold; }
    .header h2 { font-size: 13px; font-weight: normal; color: #555; margin-top: 4px; letter-spacing: 0.05em; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table td { padding: 6px 4px; border-bottom: 1px solid #eee; }
    table td.label { width: 35%; font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.03em; }
    table td.value { font-weight: bold; font-size: 13px; }
    .footer { margin-top: 30px; display: flex; justify-content: space-between; font-size: 11px; color: #666; }
    .stamp { text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>{{ institution_name }}</h1>
      <h2>HALL TICKET</h2>
    </div>

    <table>
      <tr><td class="label">Examination</td><td class="value">{{ exam_name }}</td></tr>
      <tr><td class="label">Student Name</td><td class="value">{{ student_name }}</td></tr>
      <tr><td class="label">Roll Number</td><td class="value">{{ roll_number }}</td></tr>
      {% if regulation %}
      <tr><td class="label">Regulation</td><td class="value">{{ regulation }}</td></tr>
      {% endif %}
    </table>

    <div class="footer">
      <div>
        <p style="color:#999;">This hall ticket is valid only with a photo ID.</p>
      </div>
      <div class="stamp">
        <p>Controller of Examinations</p>
        <p style="margin-top:20px;">____________________</p>
      </div>
    </div>
  </div>
</body>
</html>
